# deploiement/proxy_params_ratio.conf — les paramètres proxy du vhost.
# À copier dans /etc/nginx/proxy_params_ratio.conf.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# ÉCRASE l'en-tête du client : le premier terme de X-Forwarded-For est
# toujours la vraie adresse, jamais celle que le client a choisie.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
