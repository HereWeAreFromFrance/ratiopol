# deploiement/ratiopol.nginx.conf — le vhost nginx de RatioPol.
#
# Posé dans /etc/nginx/sites-available/ratiopol par installer-vps.sh ; la
# version ici fait foi (repousser à la main après modification, cf. git log).
#
# CONTRAT /_vu (coutume maison, cf. Miliad/deploiement/miliad.nginx.conf) :
# la page appelle /_vu (arrivée, présence, départ) ; nginx répond 204 et
# journalise ces seules frappes dans un fichier dédié, importé ensuite dans
# PostgreSQL pour les bilans d'audience. Le serveur Node en fait autant en
# direct (204) pour le développement.

limit_req_zone $binary_remote_addr zone=ratiopol_ecriture:10m rate=10r/m;

# LE JOURNAL DES VISITES (8/11/2026, la coutume GuildWeave/Lumilap) : une
# ligne JSON par beacon accepté dans /var/log/nginx/ratiopol.visites.log —
# LE NOM attendu par l'importateur de VpsBoard (outils-lumilap-journal.mjs,
# ratiopol.visites.log dans la base ratiopol_visites). `$pays` vient du bloc
# geo déclaré par le site miliad sur cette machine. Seuls les trois évènements
# connus, avec des paramètres courts, passent le journal ; une présence par
# minute par onglet, 30/min par adresse laisse la place à une adresse partagée
# et borne ce qu'une boucle peut écrire.
log_format ratiopol_vu escape=json '{"t":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","ev":"$arg_ev","sid":"$arg_sid","dur":"$arg_dur","ecr":"$arg_ecr","dpr":"$arg_dpr","lang":"$arg_lang","tact":"$arg_tact","tst":"$arg_tst","ref":"$http_referer","pays":"$pays"}';
map $args $ratiopol_vu_court { "~^.{0,400}$" 1; default 0; }
map "$arg_ev:$ratiopol_vu_court" $ratiopol_vu_ok { "~^(arrivee|presence|depart):1$" 1; default 0; }
limit_req_zone $binary_remote_addr zone=ratiopol_vu:2m rate=30r/m;

# Tout le HTTP mène au HTTPS (le certificat est posé par certbot, renouvelé
# automatiquement : authenticator nginx dans /etc/letsencrypt/renewal/).
server {
    listen 80;
    listen [::]:80;
    server_name ratiopol.fr www.ratiopol.fr;
    return 301 https://ratiopol.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ratiopol.fr www.ratiopol.fr;

    ssl_certificate /etc/letsencrypt/live/ratiopol.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ratiopol.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Le TLS est posé et contrôlé : on verrouille le HTTP d'entrée.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Les statics empreintés : cache un an, immuable.
    location /statique/ {
        alias /opt/ratiopol/actuel/dist/statique/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Le journal de visites maison : format JSON (au-dessus), dose, et les
    # beacons hors gabarit répondent 204 sans être écrits.
    location = /_vu {
        limit_req zone=ratiopol_vu burst=30 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/ratiopol.visites.log ratiopol_vu if=$ratiopol_vu_ok;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Santé : pour les contrôles post-déploiement, sans journal.
    location = /sante {
        access_log off;
        proxy_pass http://127.0.0.1:8090;
    }

    # Les écritures (dépôts, soutiens) : dosées deux fois — nginx ici,
    # serveur par empreinte ensuite (défense en profondeur).
    location ~ ^/(proposer|idee/.*/(soutien|signalement))$ {
        limit_req zone=ratiopol_ecriture burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params_ratio.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params_ratio.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 64k;

    # Ni publicité, ni tracker : rien n'a de raison de sortir.
    add_header X-Robots-Tag "index, follow" always;
}
